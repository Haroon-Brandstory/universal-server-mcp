# Local/staging MCP gateway packaging. Do NOT point at production secrets by default.
# Operator: copy .env.example → .env.docker and fill values; never commit secrets.
services:
  mcp-gateway:
    build: .
    image: global-server-mcp:local
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:7337:7337"
    # Optional: create .env.docker from .env.example (never commit secrets)
    # env_file: [.env.docker]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "7337"
      MCP_POLICY_PATH: /app/config/policy.yaml
      MCP_AUDIT_PATH: /data/logs/audit.jsonl
      MCP_METRICS_PATH: /data/logs/metrics.jsonl
      MCP_OAUTH_STORE_PATH: /data/oauth-store.json
      MCP_KILL_SWITCH: "0"
    volumes:
      - ./config:/app/config:ro
      - mcp-data:/data
      # Optional: mount GitHub App PEM (read-only)
      # - ./secrets/github-app.pem:/run/secrets/github-app.pem:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7337/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mcp-data:
