# DigitalOcean — BSD Global MCP only
# Install root: /opt/bsd-global-mcp
# Nginx on host → 127.0.0.1:7337 → this container (host network)
#
# OAuth: user 10001 + writable /data. Never mount host /usr/bin on PATH.
# PM2 restart: host systemd ctl (install-pm2-bridge.sh) — not container→rpc.sock.
#
#   sudo bash deploy/host/install-pm2-bridge.sh
#   docker compose -f deploy/docker/docker-compose.bsd-global.yml \
#     --env-file deploy/docker/.env.pm2 up -d --build

services:
  bsd-global-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bsd-global-mcp:latest
    container_name: bsd-global-mcp
    restart: unless-stopped
    network_mode: host
    # Owns /data (oauth-store + audit). Do NOT switch to bsdglobal uid.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file:
      - /etc/bsd-global-mcp/env
    environment:
      NODE_ENV: production
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: "127.0.0.1"
      MCP_HTTP_PORT: "7337"
      MCP_ALLOW_TUNNEL_HOSTS: "0"
      MCP_TRUST_PROXY: "1"
      MCP_POLICY_PATH: /app/config/policy.yaml
      MCP_PROJECTS_PATH: /app/config/projects.yaml
      MCP_SERVERS_PATH: /app/config/servers.yaml
      MCP_DATABASES_PATH: /app/config/databases.yaml
      MCP_SECURITY_TARGETS_PATH: /app/config/security.yaml
      MCP_DEPLOYMENTS_PATH: /app/config/deployments.yaml
      MCP_STACK_PROFILES_PATH: /app/config/stack-profiles.yaml
      MCP_AUDIT_PATH: /data/logs/audit.jsonl
      MCP_METRICS_PATH: /data/logs/metrics.jsonl
      MCP_OAUTH_STORE_PATH: /data/oauth-store.json
      MCP_BUILD_WORK_ROOT: /data/build-workspaces
      MCP_NPM_BIN: /usr/local/bin/npm
      MCP_PM2_BIN: /usr/local/bin/pm2
      MCP_PM2_RESTART_BIN: /usr/local/sbin/bsd-mcp-request
      MCP_PM2_NEXTJS_NAME: ${MCP_PM2_NEXTJS_NAME:-frontend-nextjs}
      MCP_PM2_STRAPI_NAME: ${MCP_PM2_STRAPI_NAME:-strapi-backend}
      PM2_HOME: /pm2-home
      BSD_MCP_CTL_DIR: /mcp-host-ctl
    group_add:
      - "33"
    volumes:
      - ../../config:/app/config:ro
      - bsd-global-mcp-data:/data
      - /var/www/html/global-brandstory:/var/www/html/global-brandstory:rw
      - /var/www/html/global-backend/bsd-strapi:/var/www/html/global-backend/bsd-strapi:rw
      # Optional: status probes (ACL via install script). Restart does NOT need this.
      - ${MCP_HOST_HOME:-/home/bsdglobal}/.pm2:/pm2-home:rw
      # Approved restart bridge: container touches file → host systemd → bsdglobal pm2
      - /var/lib/bsd-mcp/ctl:/mcp-host-ctl:rw
      - /usr/local/sbin/bsd-mcp-request:/usr/local/sbin/bsd-mcp-request:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7337/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  bsd-global-mcp-data:
