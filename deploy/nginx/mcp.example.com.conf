# Placeholder reverse proxy for Streamable HTTP + SSE MCP gateway.
# Domain: mcp.example.com — replace with operator-owned hostname + TLS certs.
# Upstream binds loopback only. Do not expose Node directly to the internet.

upstream mcp_gateway {
    server 127.0.0.1:7337;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.example.com;

    # Operator: use certbot or existing certs
    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers (gateway also enforces AuthN on /mcp)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Optional basic connection rate limit (tool AuthZ still required)
    limit_req_zone $binary_remote_addr zone=mcp_req:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=mcp_conn:10m;

    client_max_body_size 4m;

    # Public health only — no secrets
    location = /healthz {
        proxy_pass http://mcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Operator dual-auth UI — approve pending AI change requests
    # (MCP_OPERATOR_TOKEN password; never the bot MCP_API_KEY)
    location /operators {
        limit_req zone=mcp_req burst=20 nodelay;
        proxy_pass http://mcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location = /operator {
        return 302 /operators;
    }

    # OAuth discovery / authorize / token / consent (consent still needs operator key)
    location ~ ^/(authorize|token|register|oauth)/ {
        limit_req zone=mcp_req burst=40 nodelay;
        proxy_pass http://mcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Streamable HTTP MCP — long-lived; buffering OFF
    location /mcp {
        limit_req zone=mcp_req burst=60 nodelay;
        limit_conn mcp_conn 20;
        proxy_pass http://mcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Legacy SSE
    location /sse {
        limit_req zone=mcp_req burst=20 nodelay;
        proxy_pass http://mcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /messages {
        limit_req zone=mcp_req burst=40 nodelay;
        proxy_pass http://mcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Metrics require gateway AuthN — still do not expose publicly without ACL
    location /metrics {
        # Operator: restrict by IP or require mTLS at edge
        # allow 10.0.0.0/8; deny all;
        proxy_pass http://mcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
