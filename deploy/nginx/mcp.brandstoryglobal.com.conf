# mcp.brandstoryglobal.com — BSD Global MCP gateway
# Upstream: Node on loopback only. TLS via certbot.
# Install: copy to /etc/nginx/sites-available/ + enable + reload.

upstream bsd_global_mcp {
    server 127.0.0.1:7337;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=mcp_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=mcp_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.brandstoryglobal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.brandstoryglobal.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.brandstoryglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.brandstoryglobal.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 4m;

    location = /healthz {
        proxy_pass http://bsd_global_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Dual-auth write approvals (MCP_OPERATOR_TOKEN — never bot key)
    location /operators {
        limit_req zone=mcp_req burst=20 nodelay;
        proxy_pass http://bsd_global_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location = /operator {
        return 302 /operators;
    }

    location ~ ^/(authorize|token|register|oauth)/ {
        limit_req zone=mcp_req burst=40 nodelay;
        proxy_pass http://bsd_global_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /mcp {
        limit_req zone=mcp_req burst=60 nodelay;
        limit_conn mcp_conn 20;
        proxy_pass http://bsd_global_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /sse {
        limit_req zone=mcp_req burst=20 nodelay;
        proxy_pass http://bsd_global_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /messages {
        limit_req zone=mcp_req burst=40 nodelay;
        proxy_pass http://bsd_global_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /metrics {
        # Restrict by IP if needed
        proxy_pass http://bsd_global_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
