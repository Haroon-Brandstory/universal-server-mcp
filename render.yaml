# Blueprint — optional. Dashboard deploy also works if env matches.
services:
  - type: web
    name: universal-server-mcp
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /healthz
    disk:
      name: mcp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_HTTP_HOST
        value: "0.0.0.0"
      - key: MCP_ALLOW_TUNNEL_HOSTS
        value: "1"
      - key: MCP_POLICY_PATH
        value: /app/config/policy.yaml
      - key: MCP_AUDIT_PATH
        value: /data/logs/audit.jsonl
      - key: MCP_METRICS_PATH
        value: /data/logs/metrics.jsonl
      - key: MCP_OAUTH_STORE_PATH
        value: /data/oauth-store.json
      - key: MCP_KILL_SWITCH
        value: "0"
      - key: MCP_METRICS_ENABLED
        value: "1"
      - key: MCP_API_KEY
        sync: false
      - key: MCP_OAUTH_OPERATOR_KEY
        sync: false
      - key: MCP_PUBLIC_BASE_URL
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
