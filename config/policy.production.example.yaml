# Example: production — privileged tools OFF by default; write=false; admin=false for remote.
# Copy to a secured path and set MCP_POLICY_PATH. Never enable oauth_allowed on operator principals.
version: 1
environment: production
kill_switch: false
rate_limit_per_min: 30

# Production: monitoring read-only. Do not grant restart/maintenance caps lightly.
serverops:
  enabled: true
  servers_path: ./config/servers.yaml
  require_maintenance_approval: true
  maintenance_rate_limit_per_min: 2
  default_timeout_sec: 20
  max_log_bytes: 32000

databaseops:
  enabled: true
  databases_path: ./config/databases.yaml
  require_migration_approval: true
  require_backup_before_destructive: true
  allow_production_migrations: false
  default_statement_timeout_ms: 3000
  default_max_rows: 50
  default_max_result_bytes: 32000

securityops:
  enabled: true
  targets_path: ./config/security.yaml
  allow_production_scans: false
  force_mock_scanners: false
  max_findings_per_scan: 100
  scanner_timeout_sec: 60

deployops:
  enabled: true
  deployments_path: ./config/deployments.yaml
  allow_production_dispatch: false
  require_ci_green: true
  require_security_gate: true

projects:
  - id: prod-app
    allow_hosts:
      - app.example.com
      - api.example.com
    allow_paths: []   # CodeOps off unless you explicitly add read-only roots
    github_repos:
      - your-org/your-app

github:
  require_write_approval: true
  deny_commit_branches: [main, master, production, prod, release]

oauth:
  allowed_redirect_uris:
    - https://grok.com/connectors-oauth-exchange-code/
  default_principal_id: oauth-remote
  allow_dynamic_registration: false

principals:
  - id: prod-operator
    api_key_env: MCP_API_KEY
    roles: [operator]
    projects: [prod-app]
    allow_hosts: []
    allow_paths: []
    capabilities:
      - http.request
      - page.navigate
      - page.snapshot
      - page.wait
      - session.create
      - session.close
      - policy.explain
      - git.repo.list
      - git.repo.info
      - git.branch.list
      - git.file.read
      - git.diff
      - git.pr.status
      - git.ci.status
      - server.list
      - server.health
      - server.metrics
      - server.services
      - server.service.status
      - server.logs.read
      - server.ssl.status
      - server.disk.status
      - server.processes
      - server.security.status
      - db.connections
      - db.health
      - db.schemas
      - db.tables
      - db.table.describe
      - db.query.read
      - db.performance
      - db.indexes
      - db.backup.status
      - security.audit.headers
      - security.audit.tls
      - security.findings
      - deploy.projects
      - deploy.environments
      - deploy.history
      - deploy.plan
      - deploy.validate
      - deploy.status
      - deploy.rollback.plan
    allow_methods: [GET, HEAD, OPTIONS]
    write: false
    admin: false
    oauth_allowed: false
    max_response_bytes: 16384

  - id: oauth-operator
    api_key_env: MCP_OAUTH_OPERATOR_KEY
    roles: [oauth_operator]
    allow_hosts: []
    capabilities: []
    allow_methods: [GET]
    write: false
    admin: false
    oauth_operator: true
    max_response_bytes: 1024

  - id: oauth-remote
    roles: [remote_readonly]
    projects: [prod-app]
    allow_hosts: []
    allow_paths: []
    capabilities:
      - http.request
      - page.navigate
      - page.snapshot
      - page.wait
      - session.create
      - session.close
      - policy.explain
    allow_methods: [GET, HEAD, OPTIONS]
    write: false
    admin: false
    oauth_allowed: true
    max_response_bytes: 8192

deny_hosts:
  - metadata.google.internal
  - metadata.azure.com
  - 169.254.169.254

ssrf:
  block_private: true
  block_loopback: true
  block_link_local: true
  block_metadata: true
