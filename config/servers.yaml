# ServerOps registry — mock entries for local/dev. Do not point at production
# without known_hosts + non-root keys + explicit operator review.
# Never put private keys or passwords in this file.
version: 1
servers:
  - id: brandstory-fe-dev
    label: Brandstory FE (dev mock)
    project_id: brandstory-fe
    environment: development
    enabled: true
    connection:
      method: mock
      host: 127.0.0.1
      port: 22
      user: mcp-monitor
    services:
      - nginx
      - pm2
      - nextjs
      - systemd
    approved_maintenance:
      - service.restart
      - cache.clear
      - maintenance.run
      - nginx.reload
      - pm2.save
      - disk.inode.check
    monitoring:
      ssl_hosts: []
      health_urls:
        - http://127.0.0.1:3000/api/health
      log_sources:
        - nginx
        - pm2

  - id: brandstory-be-dev
    label: Brandstory BE / Strapi (dev mock)
    project_id: brandstory-be
    environment: development
    enabled: true
    connection:
      method: mock
      host: 127.0.0.1
      port: 22
      user: mcp-monitor
    services:
      - nginx
      - pm2
      - strapi
      - postgres
      - systemd
    approved_maintenance:
      - service.restart
      - cache.clear
      - maintenance.run
      - nginx.reload
      - disk.inode.check
    monitoring:
      ssl_hosts: []
      health_urls:
        - http://127.0.0.1:1337/_health
      log_sources:
        - strapi
        - postgres

  # --- Real VPS (SSH) — set enabled: true after host + keys ready ---
  # Render: set MCP_SSH_KEY_FE_PEM + MCP_SSH_KNOWN_HOSTS_FE (entrypoint writes files).
  # Or set MCP_SSH_KEY_FE_PATH / MCP_SSH_KNOWN_HOSTS_FE_PATH to absolute file paths.
  - id: brandstory-fe-staging
    label: Brandstory FE staging VPS
    project_id: brandstory-fe
    environment: staging
    enabled: false
    connection:
      method: ssh
      host: REPLACE_FE_VPS_HOST
      port: 22
      user: mcp-ops
      private_key_path_env: MCP_SSH_KEY_FE_PATH
      known_hosts_path_env: MCP_SSH_KNOWN_HOSTS_FE_PATH
    services:
      - nginx
      - pm2
      - nextjs
      - systemd
    approved_maintenance:
      - cache.clear
      - nginx.reload
    monitoring:
      ssl_hosts:
        - REPLACE_FE_PUBLIC_HOST
      health_urls:
        - https://REPLACE_FE_PUBLIC_HOST/api/health
      log_sources:
        - nginx
        - pm2

  - id: brandstory-be-staging
    label: Brandstory BE / Strapi staging VPS
    project_id: brandstory-be
    environment: staging
    enabled: false
    connection:
      method: ssh
      host: REPLACE_BE_VPS_HOST
      port: 22
      user: mcp-ops
      private_key_path_env: MCP_SSH_KEY_BE_PATH
      known_hosts_path_env: MCP_SSH_KNOWN_HOSTS_BE_PATH
    services:
      - nginx
      - pm2
      - strapi
      - postgres
      - systemd
    approved_maintenance:
      - cache.clear
      - nginx.reload
    monitoring:
      ssl_hosts:
        - REPLACE_BE_PUBLIC_HOST
      health_urls:
        - https://REPLACE_BE_PUBLIC_HOST/_health
      log_sources:
        - strapi
        - nginx
