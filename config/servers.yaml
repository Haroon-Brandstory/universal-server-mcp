# BSD Global only — same-host MCP on DigitalOcean (/opt/bsd-global-mcp).
# local = curated commands on the MCP host. No multi-tenant SSH fleet.
version: 1
servers:
  - id: brandstory-fe-dev
    label: Brandstory FE (local Next.js laptop)
    project_id: brandstory-fe
    environment: development
    enabled: true
    connection:
      method: local
      host: 127.0.0.1
      port: 22
      user: local
    services:
      - nextjs
    approved_maintenance:
      - cache.clear
    monitoring:
      ssl_hosts: []
      health_urls:
        - http://127.0.0.1:3000/
      log_sources:
        - nextjs

  - id: brandstory-be-dev
    label: Brandstory BE / Strapi (local laptop)
    project_id: brandstory-be
    environment: development
    enabled: true
    connection:
      method: local
      host: 127.0.0.1
      port: 22
      user: local
    services:
      - strapi
    approved_maintenance:
      - cache.clear
    monitoring:
      ssl_hosts: []
      health_urls:
        - http://127.0.0.1:1337/_health
      log_sources:
        - strapi

  # --- DigitalOcean VPS (MCP on same box as apps) ---
  - id: brandstory-fe-vps
    label: Brandstory FE on VPS
    project_id: brandstory-fe
    environment: production
    enabled: true
    connection:
      method: local
      host: 127.0.0.1
      port: 22
      user: local
    services:
      - nextjs
      - nginx
      - pm2
    approved_maintenance:
      - cache.clear
      - nginx.reload
      - maintenance.run
      - nextjs.build
      - service.restart
    monitoring:
      ssl_hosts:
        - brandstoryglobal.com
        - www.brandstoryglobal.com
      health_urls:
        - http://127.0.0.1:3000/
        - https://brandstoryglobal.com/
        - https://www.brandstoryglobal.com/
      log_sources:
        - nextjs
        - nginx

  - id: brandstory-be-vps
    label: Brandstory BE / Strapi on VPS
    project_id: brandstory-be
    environment: production
    enabled: true
    connection:
      method: local
      host: 127.0.0.1
      port: 22
      user: local
    services:
      - strapi
      - nginx
      - pm2
    approved_maintenance:
      - cache.clear
      - nginx.reload
      - maintenance.run
      - strapi.build
      - service.restart
    monitoring:
      ssl_hosts:
        - brandstoryglobal.com
      health_urls:
        - http://127.0.0.1:1337/_health
        - https://brandstoryglobal.com/api/
      log_sources:
        - strapi
        - nginx
