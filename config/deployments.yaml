# BSD Global deploy registry — prod dispatch stays off until signed.
version: 1
projects:
  - id: brandstory-fe-deploy
    project_id: brandstory-fe
    label: Brandstory Frontend
    enabled: true
    known_good_shas: []
    environments:
      - name: staging
        provider: vps
        profile: nextjs
        server_id: brandstory-fe-vps
        action_id: nextjs.deploy
        health_checks:
          - url: https://brandstoryglobal.com/
            expect_status: 200
      - name: production
        provider: vps
        profile: nextjs
        server_id: brandstory-fe-vps
        action_id: nextjs.deploy
        health_checks:
          - url: https://www.brandstoryglobal.com/
            expect_status: 200

  - id: brandstory-be-deploy
    project_id: brandstory-be
    label: Brandstory Strapi
    enabled: true
    known_good_shas: []
    environments:
      - name: staging
        provider: vps
        profile: strapi
        server_id: brandstory-be-vps
        action_id: strapi.deploy
        requires_db_compat: true
        health_checks:
          - url: http://127.0.0.1:1337/_health
            expect_status: 200
      - name: production
        provider: vps
        profile: strapi
        server_id: brandstory-be-vps
        action_id: strapi.deploy
        requires_db_compat: true
        health_checks:
          - url: http://127.0.0.1:1337/_health
            expect_status: 200
