# BSD Global security targets only.
version: 1
targets:
  - id: brandstory-fe-sec
    label: Brandstory FE security target
    project_id: brandstory-fe
    environment: production
    enabled: true
    allowed_scans:
      - code
      - dependencies
      - secrets
      - headers
      - tls
    frameworks: [nextjs]
    scan_roots: ["."]
    http_origins:
      - https://brandstoryglobal.com
      - https://www.brandstoryglobal.com
    container_images: []

  - id: brandstory-be-sec
    label: Brandstory BE / Strapi security target
    project_id: brandstory-be
    environment: production
    enabled: true
    allowed_scans:
      - code
      - dependencies
      - secrets
      - server
      - headers
      - tls
    frameworks: [strapi]
    scan_roots: ["."]
    http_origins:
      - https://brandstoryglobal.com
    server_id: brandstory-be-vps
