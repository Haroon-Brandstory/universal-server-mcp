# Example: staging — no CodeOps writes; loopback blocked; admin audit only for operators.
version: 1
environment: staging
kill_switch: false
rate_limit_per_min: 40

# Read-only ServerOps by default; maintenance caps omitted.
serverops:
  enabled: true
  servers_path: ./config/servers.yaml
  require_maintenance_approval: true
  maintenance_rate_limit_per_min: 3
  default_timeout_sec: 30

projects:
  - id: staging-app
    allow_hosts:
      - staging.example.com
    allow_paths:
      - /srv/apps/staging-app
    github_repos:
      - your-org/your-app

github:
  require_write_approval: true

oauth:
  allowed_redirect_uris:
    - https://grok.com/connectors-oauth-exchange-code/
  default_principal_id: oauth-remote
  allow_dynamic_registration: false

principals:
  - id: staging-operator
    api_key_env: MCP_API_KEY
    roles: [operator]
    projects: [staging-app]
    allow_hosts: []
    allow_paths: []
    capabilities:
      - http.request
      - page.navigate
      - page.snapshot
      - page.wait
      - session.create
      - session.close
      - policy.explain
      - audit.tail
      - code.list
      - code.read
      - code.search
      - git.repo.list
      - git.repo.info
      - git.branch.list
      - git.file.read
      - git.diff
      - git.pr.status
      - git.ci.status
      - server.list
      - server.health
      - server.metrics
      - server.services
      - server.service.status
      - server.logs.read
      - server.ssl.status
      - server.disk.status
      - server.processes
      - server.security.status
    allow_methods: [GET, HEAD, OPTIONS]
    write: false
    admin: true
    oauth_allowed: false
    max_response_bytes: 32768

  - id: oauth-operator
    api_key_env: MCP_OAUTH_OPERATOR_KEY
    roles: [oauth_operator]
    allow_hosts: []
    capabilities: []
    allow_methods: [GET]
    write: false
    oauth_operator: true
    max_response_bytes: 1024

  - id: oauth-remote
    roles: [remote_readonly]
    projects: [staging-app]
    allow_hosts: []
    capabilities:
      - http.request
      - page.navigate
      - page.snapshot
      - page.wait
      - session.create
      - session.close
      - policy.explain
      - code.list
      - code.read
      - code.search
    allow_methods: [GET, HEAD, OPTIONS]
    write: false
    admin: false
    oauth_allowed: true
    max_response_bytes: 16384

deny_hosts:
  - metadata.google.internal
  - metadata.azure.com

ssrf:
  block_private: true
  block_loopback: true
  block_link_local: true
  block_metadata: true
